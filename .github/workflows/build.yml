# Tests and builds the firmware on every push and pull request.
# Pushing a tag like v1.1.0 also publishes a GitHub release with the firmware image.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write # create releases
  id-token: write # sign the build provenance (Sigstore)
  attestations: write # store the attestation on GitHub

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: |
          rustup toolchain install # the version and target pinned in rust-toolchain.toml
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm libsdl2-dev

      - name: Test
        run: cd ui && cargo test

      - name: Build simulator
        run: cd sim && cargo build --release

      - name: Build firmware
        run: ./build.sh

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: DMT99-custom
          path: DMT99-custom.BIN

      - name: Prepare release files
        if: startsWith(github.ref, 'refs/tags/v')
        id: release
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' ui/Cargo.toml | head -1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the version in ui/Cargo.toml ($version)" >&2
            exit 1
          fi
          bin="DMT99-custom-v$version.BIN"
          cp DMT99-custom.BIN "$bin"
          sha256sum "$bin" > "$bin.sha256"
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.release.outputs.bin }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          BIN: ${{ steps.release.outputs.bin }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          notes="Flash with \`./flash-dmt99.sh $BIN\` on Linux, or copy the file to the meter's BOOT disk on Windows and press AUTO. See the README for details.

          **Built by GitHub Actions** from commit $GITHUB_SHA ([build log]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)), with a signed build provenance attestation. Verify the file:

          \`\`\`
          gh attestation verify $BIN -R $GITHUB_REPOSITORY
          \`\`\`

          The build is reproducible: \`git checkout $GITHUB_REF_NAME && ./build.sh\` produces the same SHA-256."
          gh release create "$GITHUB_REF_NAME" "$BIN" "$BIN.sha256" \
            --title "DMT-99 custom firmware $VERSION" \
            --notes "$notes" \
            --generate-notes
